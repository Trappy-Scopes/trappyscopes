## -------------------------------------------------------------------------------------##
## Trappy-Scopes default config schema                                                  ##
## -----------------------------------                                                  ##
##                                                                                      ##
##                                                                                      ##
## Some quirks:                                                                         ##
## 1. In case of structured options (e.g. venv, file_server), the "active" keyword      ##
##    causes the whole block to be ignored (no validation).                             ##
## 2. Absense of a field is presumed to have the "active" field as false. Thats the     ##
##    default option for most optional configuration parameters.                        ##
## 3. The default way to specify "kind" is using the python path syntax: <module>.<sub- ##
##    module>.<sub-sub-module>.Object .                                                 ##
## 4. There is a basic support for configurable paths/options using the python f-string ##
##    synatax. For e.g.: `file_server.destination`, if set to "{date}_{scopeid}_{user}" ##
##    will make a directory: "1997_01_01_Mach42_ADent".                                 ##
##                                                                                      ##
##    The following variables are supported:                                            ##
##    1. scopeid: synonymous to the scope-name                                          ##
##    2. date:    with yyyy_MM_dd formatiing                                            ##
##    3. time:    with HH_mm_ss formatting                                              ##
##    4. user:    shorthand user-name that is updated using `user.login("<username>")`. ##
##                                                                                      ##
##                                                                                      ##
## Please note that `PyYAML` and `Confuse`, which are used to parse and maintain config ##
## in this lib do not parse comments, so this text will not be pasted in the actual     ##
## configuration file.                                                                  ##
## -------------------------------------------------------------------------------------##
## AI Generated -- keys added by Claude (Anthropic), 2026-09: config.keyboard_shortcuts, ##
## Experiment.record_edit_history/protocols_dirs/protocols. config.trappydir and         ##
## Experiment.protocols_dir (singular, stale) were removed as dead/superseded.           ##
## -------------------------------------------------------------------------------------##

name: <TrappySomething>            ## Name of the scope (scopeid)


## Trappy-Scopes configuration options
config:
  config_files: []           # Append more configuration files
  ui_mode: interactive       # User interaction mode
  autostart_cli_after_reboot: false  # Reserved for a future feature. Not yet read by any code.
  terminal_editor:           # Editor used to open the config file for editing (launcher's
                              # "Edit the configuration file"). If unset: nano if installed,
                              # else vi.
  venv:                      # Whether to use a virtual environment for 
      active: false          # Config block is active. The function is turned on.
      command: source ~/opt/miniconda3/bin/activate 
      name: trappy                # Name of the virtual environment that will be called after the command
  git_sync:                  # Automatically git-sync certain repositories
    active: false                # Config block is active. The function is turned on.
    command: git pull           # Exact command to use for git syncronisation
    repos: []                   # List of local repositories, where the command will be called
                   
  set_wallpaper: false       # This option will set a "information" panel as the wallpaper. This helps to id the device, incase of multiplexing.
  log_level: 20              # Log level of the root logger. Use 10 for debug. 20 is info and higher.
  config_server:             # Configuration files are synchronised with this server, when changed.         
    active: false
    server: <ip>/<address>
    share: <name-of-server-share>
    destination: "{date}"   # Sub folder inside the share. This will create a folder with the "current date" opon operation.
    username: <username>
    password: <password>
  config_redact_fields:     # Fields that will be redacted, if the config file is copied
    - username
    - password
  startup_recipie: freestyle     # Experiment environment (EXPENV) that defines how the CLI session is created.
                                 # `freestyle`: full assembly + experiment environment + user tools (default).
                                 # `raw`: constructs the ScopeAssembly and nothing else, near-silently.
                                 # Also accepts a dotted path to any module exposing `build(config)`.
                                 # See `expenv/__init__.py`. The legacy value `core.startup` still maps to `freestyle`.
  startup_scripts: []            # Scripts to run by default when the CLI is started.
  micropython:                   # MicroPython device management (launcher's "MicroPython" submenu)
    version:                     # Locked/supported MicroPython version, e.g. "1.20.0" -- a
                                  # device already at this version is skipped when flashing.
    firmware_image:              # Local path to that version's .uf2 firmware image.
    firmware_dir:                 # Local path to the pico_firmware repo's ROOT (not a
                                  # subfolder inside it) -- mirrored onto a device's own
                                  # filesystem root, filtered by that repo's own
                                  # sync_what.yaml if it declares one.
  keyboard_shortcuts:             # Esc-prefixed REPL shortcuts -- see utilities/keyboard_shortcuts.py
    active: false                 # Config block is active. The function is turned on.
    scope_assembly: true          # Auto-bind Esc,s,<letter> per mounted device (only if active: true)
    experiment: true              # Auto-bind the Esc,e,<letter> Experiment member table (only if active: true)
    file:                         # Optional separate YAML file, its own top-level `bindings:` list
    bindings: []                  # Optional inline list, e.g.:
                                   #   - keys: "esc x"
                                   #     code: "scope.draw_tree()"
                                   #     submit: true
                                   #     description: "My shortcut"

## Recognized users -- keyed by the lab's two-letter login code (see
## core/bookkeeping/user.py). An unrecognized code is refused by
## User.login() unless called with force=True. Expands (unions) across
## every layered config_files source -- see README's "Expanded config
## fields" table -- so a lab-wide manifest can add users without
## disturbing whatever a device's own config already declares.
# Users:
#   YB: {full_name: "Yatharth Bhasin", email: "yatharth.bhasin@gimm.pt", designation: "PI"}
#   CC: {full_name: "...", email: "...", designation: "..."}

## Experiment configuration options
Experiment:
  scripts_dirs:                       # Directories ScriptEngine.find() offers when picking a script
    - ~/trappyscopes/scripts/         # interactively. This one is already read by the code as-is
    - ~/trappyscopes/tests/           # (expframework/scriptengine.py); the rest of this block below
                                       # describes the target format and is not read yet -- see
                                       # docs/notes/restructuring.md §12.
  exp_dir: ~/experiments              # Default directory where experiments are stored
  record_edit_history: true           # Whether editing a recordset() entry also appends to
                                       # event_edits.yaml (a separate trail, not inline in
                                       # experiment.yaml -- see docs/notes/protocols.md §8).
  protocols_dirs: []                  # Local clone(s) expframework.protocol.Protocol resolves from --
                                       # see config.git_dependencies to have one cloned automatically
                                       # and docs/notes/protocols.md for the resolution/provenance design.
  protocols:
    publish_remote_link: true         # Record each loaded protocol's GitHub permalink (derived from
                                       # local git metadata, no network call) in the experiment log.
                                       # Overridable per file via that file's own frontmatter.
  calibration_dir: ~/calibration_dir  # Directory where calibrations are stored.
  exp_dir_structure:                  # This is the directory structure, that will be created within every experiment.
    - scripts
    - postprocess
    - converted
    - analysis
  sync:                               # How ExpSync classifies each file (see docs/notes/sync_rework.md §4).
    manifest:                         # Never moved, only ever copied -- so both the local copy and the
      - .experiment                   # server copy stay legible experiments. Data files (below) move
      - experiment.yaml               # instead, freeing space on the acquisition machine.
      - sessions.yaml                 #
      - expstate.pickle               # EXPANDS across layered config files (unions, does not replace) --
      - logs.yaml                     # a lab-wide manifest can add entries without disturbing a device's
      - event_edits.yaml              # own. Anything matching neither this list nor git_tracking.exclude
      - filetree.yaml                 # is copied too; this list's real job is to state what must never be
      - sync.yaml                     # moved even if an exclude pattern would otherwise match it.
      - .gitignore
      - .git
      - scripts
                                       # What *moves* is not a second list -- it is git_tracking.exclude
                                       # below, so .gitignore generation, git tracking and sync disposition
                                       # can never drift apart.
  git_tracking:                       # Optional per-experiment git repository (see expframework/expgit.py).
    active: false                     # Local-only -- this never pushes anywhere on its own.
    exclude:                          # Glob patterns kept out of the experiment's own repo -- same reasoning
      - "*.mp4"                       # as this codebase's own top-level .gitignore: large binary media
      - "*.h264"                      # doesn't belong in git history. ExpSync is still the mechanism for
      - "*.png"                       # actually moving that media (to the file server), not this.
      - "*.jpg"
      - "*.tiff"
  exp_report: false                   # Unused as of 2026-09-15: ExpReport moved out to the
                                       # trappy-explorer repo (explorer/report.py), parked for later
                                       # development. Key kept so existing configs don't error; it is
                                       # read by nothing.
  eid_generator: core.uid.uid         # This is the funtion that will be called to generate experiment IDs. By default is calls `nanoid.generate('1234567890abcdef', 10)`
  file_server:                        # File server for synchronisation of experiments
    active: false
    server: <ip>/<address>
    share: <name-of-server-share>
    destination: "{date}"
    username: <username>
    password: <password>
    # sync_prefix:                     # Optional: override the command rsync is launched with (see
    #   - ionice                       # expframework/expsync.py's ExpSync._sync_prefix()). Left unset,
    #   - -c2                          # defaults to ["ionice", "-c2", "-n4"] on Linux, [] elsewhere -- no
    #   - -n4                          # `sudo` anywhere by default. Set this explicitly (e.g. to include
                                        # "sudo") only if your deployment's capture files are root-owned and
                                        # can't be fixed with group permissions instead.


## The main device assembly is described here
ScopeAssembly:
  <hostname>: 
    description: "Host processorgroup."
    kind: hive.processorgroups.abstractprocessorgroup.ProcessorGroup
    args: []
    kwargs: {}


