# mkdocs.yml
site_name: Trappy-Scopes Control Layer Interface
site_url: https://trappy-scopes.github.io/trappyscopes/
repo_url: https://github.com/Trappy-Scopes/trappyscopes

nav:
  - Home: index.md
  - Introduction: notes/intro.md
  - hive:
      - Overview: hive/index.md
      - API Reference: hive/api.md
  - expframework:
      - Overview: expframework/index.md
      - Experiment: expframework/experiment.md
      - Measurement streams: expframework/measurement.md
      - Scheduler: expframework/scheduler.md
      - Clocks: expframework/clocks.md
      - Notebook: expframework/notebook.md
      - File sync: expframework/sync.md
      - Protocols: expframework/protocol.md
      - Script engine: expframework/scriptengine.md
      - Reports: expframework/report.md
      - Plotting: expframework/plotter.md
      - API Reference: expframework/api.md
  - core:
      - Overview: core/index.md
      - API Reference: core/api.md
  - optics:
      - Overview: optics/index.md
      - API Reference: optics/api.md
  - Notes:
      - Introduction: notes/assmble_trappy_scopes.md
      - Hive: notes/hive.md       
      - Optics: notes/optics.md
      - Project Management: notes/projectman.md
      - Devices: notes/devices.md            
      - picamera2 API: notes/picamera2.md
  - All Trappy-Scopes Projects: https://trappy-scopes.github.io







plugins:
  - search
  - blogging
  - external-markdown
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
            show_source: true
            show_if_no_docstring: true
            show_root_heading: true
            heading_level: 2

#  - autorefs
#  - redirects
#      scripts:
#        - generate_docs.py

extra:
  homepage: https://trappy-scopes.github.io/trappyscopes/

theme:
  logo: assets/tsicon.png
  name: material
  primary: trappytheme
  palette:
    # Dark mode as default
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode option
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.highlight
    - content.code.annotate
    - content.code.copy

extra_css:
  - stylesheets/extra.css


markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
