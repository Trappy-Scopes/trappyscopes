[project]
name = "trappyscopes"
version = "0.1.1"
description = "Control Layer Interface for parallel microscopy system."
authors = [
    {name = "Yatharth Bhasin",email = "yatharth1997@gmail.com"}
]
readme = "README.md"
# 3.11: Raspberry Pi OS Bookworm's system Python, which the apt camera stack
# (picamera2, libcamera) is built for. <3.13: numpy 1.26.4 has no 3.13 wheels.
requires-python = ">=3.11,<3.13"
dependencies = [
    "asciichartpy (>=1.5.25,<2.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "pyyaml (==6.0.1)",
    "confuse (>=2.0.1,<3.0.0)",
    "dill (>=0.4.0,<0.5.0)",
    "smmap (==5.0.1)",
    "gitpython (>=3.1.45,<4.0.0)",
    "markdown-it-py (>=3.0.0,<5.0.0)",   # expframework/protocol.py; was only there through rich
    "matplotlib",
    "nanoid (>=2.0.0,<3.0.0)",
    "numpy (==1.26.4)",          # locked: apt's simplejpeg (picamera2) needs numpy 1.x
    "openpyxl (>=3.1.5,<4.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "plotext (>=5.3.2,<6.0.0)",
    "prompt-toolkit (>=3.0.51,<4.0.0)",
    "psutil (>=6.0.0,<7.0.0)",
    "pyserial (>=3.5,<4.0)",
    "requests (>=2.32.4,<3.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "rpyc (>=6.0.2,<7.0.0)",
    "schedule (>=1.2.2,<2.0.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "textual (>=5.3.0,<6.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "timeboard (>=0.2.4,<0.3.0)",
    # Previously only declared in core/installer/installer.py's Installer.pylibs,
    # absent here -- two lists disagreeing on what this project needs. Reconciled.
    "art",
    "beautifulsoup4",
    "paho-mqtt",
    "sounddevice",
    "websockets",
]

[project.optional-dependencies]
# The camera stack is locked to these versions. On a Raspberry Pi the
# raspberrypi hardware profile installs picamera2 from apt
# (python3-picamera2=0.3.31-1), not from here; this extra records the same lock
# for pip-only setups. See docs/notes/hardware_profiles.md.
raspberrypi = ["picamera2==0.3.31"]

[project.scripts]
trappyscope = "launcher:main"

[build-system]
# Poetry removed: uv is the backbone going forward (see restructuring.md).
# hatchling is a minimal, PEP 621-native build backend -- no dialect of its
# own to fight with, unlike poetry-core, which is exactly how the
# dependencies/requires-python misplacement bug happened in the first place.
requires = ["hatchling"]
build-backend = "hatchling.build"
